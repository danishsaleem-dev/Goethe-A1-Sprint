name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate content files
        run: python3 tools/validate_data.py

      - name: Add the Android project (only if it is not committed)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name german_a1 --org com.danish /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            cp -n /tmp/scaffold/analysis_options.yaml . || true
          fi
          dart run tools/setup.dart

      - run: flutter pub get

      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: german-a1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
